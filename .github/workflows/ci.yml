name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Platform-independent checks: lint, type check, unit + state-machine tests,
  # and a C# 5 compile check of the Windows helper (Mono), on Linux.
  checks:
    name: Lint, types, tests, C# 5 compile check (Linux)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dev dependencies
        run: npm ci
      - name: No runtime dependencies (zero-deps rule)
        run: |
          node -e "const p=require('./package.json'); const d=Object.keys(p.dependencies||{}); if(d.length){console.error('runtime deps found: '+d.join(', ')); process.exit(1)} console.log('ok, 0 runtime dependencies')"
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc --checkJs)
        run: npm run typecheck
      - name: D-Bus tools for the Linux portal tests (dbus-daemon, busctl)
        run: |
          if ! command -v dbus-daemon >/dev/null || ! command -v busctl >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q dbus-daemon systemd
          fi
          dbus-daemon --version | head -1
          busctl --version | head -1
      - name: Unit and state-machine tests
        run: npm test
      - name: Install Mono (C# compiler)
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-mcs mono-devel mono-runtime
      - name: Windows helper compiles under C# 5
        run: scripts/check-helper-cs.sh
      - name: Fuzz the Windows helper's JSON command parser (Mono)
        run: scripts/fuzz-helper-json.sh

  renderers:
    name: Renderer checks in Electron (Linux, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies (with the Electron binary)
        run: npm ci
      - name: Overlay, settings, welcome, drop-pad and CSP checks
        # --no-sandbox: the runner's AppArmor policy blocks Chromium's user
        # namespace sandbox; these checks load only the app's own local pages.
        run: |
          for t in overlay-css-check settings-models-check welcome-perms-check pad-check csp-check settings-tabs-check; do
            echo "== $t"
            xvfb-run -a npx electron "test/$t.js" --no-sandbox
          done
      - name: D-Bus tools for the Linux boot check
        run: |
          if ! command -v dbus-daemon >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q dbus-daemon
          fi
      - name: Linux boot check (real app, fake desktop portal)
        run: xvfb-run -a node test/linux-boot-check.js

  # Linux: build whisper-server from the pinned tag and transcribe a real sample
  # through the app's own server.js/client.js (also checks the WS-13
  # --request-path lockdown against the real binary). Then package the app
  # (electron-builder --dir, fuses applied), check the packaged app against a
  # fake desktop portal with the real engine, and hand it to the Flatpak job.
  # Finally build and check the AppImage, uploaded as an artifact.
  whisper-linux:
    name: Linux whisper-server, real transcription, packaged app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies (with the Electron binary)
        run: npm ci
      - name: Cache the whisper.cpp source and build tree
        uses: actions/cache@v5
        with:
          path: ~/.cache/SayAnything/whisper-build
          key: whisper-linux-v1.9.1-${{ hashFiles('scripts/build-whisper-linux.sh') }}
      - name: Build whisper-server (static, CPU, x86-64-v3)
        run: scripts/build-whisper-linux.sh
      - name: Cache the tiny.en test model
        uses: actions/cache@v5
        with:
          path: ~/sa-e2e
          key: model-tiny.en-921e4cf8686fdd99
      - name: Real transcription (tiny.en, jfk.wav) + request-path lockdown
        run: SA_REQUIRE_WHISPER=1 SA_E2E_DATA="$HOME/sa-e2e" node test/whisper-linux-e2e.js
      - name: Tools for the packaged-app check and desktop file validation
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dbus-daemon desktop-file-utils appstream
      - name: Validate the .desktop file and AppStream metadata
        run: |
          desktop-file-validate packaging/flatpak/io.github.lightningmarshal.SayAnything.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.lightningmarshal.SayAnything.metainfo.xml
      - name: Package the Linux app (electron-builder --dir, fuses applied in afterPack)
        run: |
          mkdir -p build-resources/models
          npx electron-builder --linux --dir
      - name: Packaged app check (fuses, RunAsNode, smoke with the real engine, portal shortcuts)
        run: SA_TEST_MODEL="$HOME/sa-e2e/SayAnything/models/ggml-tiny.en.bin" xvfb-run -a node test/linux-packaged-check.js
      - name: Hand the packaged app to the Flatpak job (tar keeps file modes)
        run: tar -C dist -czf linux-unpacked.tar.gz linux-unpacked
      - uses: actions/upload-artifact@v5
        with:
          name: linux-unpacked
          path: linux-unpacked.tar.gz
          retention-days: 3
      - name: Build the AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: AppImage check (contents, then the AppImage itself, against a fake portal)
        run: SA_TEST_MODEL="$HOME/sa-e2e/SayAnything/models/ggml-tiny.en.bin" xvfb-run -a node test/linux-appimage-check.js dist/SayAnything-*-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v5
        with:
          name: SayAnything-AppImage
          path: dist/SayAnything-*-linux-x86_64.AppImage
          retention-days: 7

  # Flatpak bundle for testing on real desktops (SteamOS, Ubuntu). Built in
  # Flathub's own container; whisper-server is rebuilt inside the Flatpak SDK
  # from the pinned commit. The .flatpak bundle is uploaded as an artifact.
  flatpak:
    name: Flatpak bundle
    needs: whisper-linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: linux-unpacked
      - name: Unpack the packaged app
        run: mkdir -p dist && tar -C dist -xzf linux-unpacked.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SayAnything.flatpak
          manifest-path: packaging/flatpak/io.github.lightningmarshal.SayAnything.yml
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    name: Windows helper build + self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Unit and state-machine tests
        run: npm test
      - name: Compile native helper (Windows csc.exe)
        shell: cmd
        run: native\build.cmd
      - name: Helper self-test
        run: node test/helper-selftest.js
      - name: History is encrypted with the real OS keystore (DPAPI)
        run: node test/run-electron-check.js test/history-electron-check.js
      - name: Setup without a model (downloads whisper.cpp, checks its pinned SHA-256)
        run: node scripts/setup.js --no-model
      - name: Electron smoke test (settings, helper, whisper binaries)
        run: npm run smoke

  package-windows:
    name: Package Windows app + fuses + packaged smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Compile native helper (Windows csc.exe)
        shell: cmd
        run: native\build.cmd
      - name: Setup (whisper.cpp zip and the default model, both SHA-256 pinned)
        run: node scripts/setup.js
      - name: Package unpacked app (electron-builder --dir, fuses applied in afterPack)
        run: npm run dist:dir
      - name: Verify fuses, RunAsNode, and the packaged app's smoke test
        run: node scripts/check-packaged-app.js "dist/win-unpacked/Say Anything.exe"

  macos:
    name: macOS helper build + tests
    runs-on: macos-14
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dev dependencies
        run: npm ci
      - name: Unit and state-machine tests
        run: npm test
      - name: Compile native helper (swiftc, universal)
        run: native/build-mac.sh
      - name: Helper self-test (no TCC grants on CI; checks protocol, perms, clipboard)
        env:
          CI: '1'
        run: node test/helper-selftest.js
